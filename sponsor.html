<!doctype html>
<html lang="en" class="notranslate">
<head>
  <meta charset="utf-8" />
  <meta name="google" content="notranslate" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07070b" />
  <title>Advertise — PROJECT 99</title>
  <meta name="description" content="Advertising and sponsorship opportunities in PROJECT 99." />
  <link rel="stylesheet" href="./styles.css?v=21" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="./" style="text-decoration:none">PROJECT <span>99</span></a>
      <div class="pill">PARTNERS</div>
    </header>
    <section class="screen active">
      <div class="hero-copy">
        <p class="eyebrow">ADVERTISING / SPONSORSHIP</p>
        <h1>Put your brand<br/>inside the challenge.</h1>
        <p class="subtitle">PROJECT 99 is a fast daily camera challenge with global ranking. Sponsorship can appear around the challenge and result experience without interrupting gameplay.</p>
      </div>
      <section class="sponsor-lead-card">
        <p class="eyebrow">CONTACT</p>
        <form id="sponsorLead" class="sponsor-lead-form">
          <input id="sponsorCompany" maxlength="120" autocomplete="organization" placeholder="Company / Firma" required />
          <input id="sponsorEmail" maxlength="160" type="email" autocomplete="email" placeholder="E-mail" required />
          <textarea id="sponsorMessage" maxlength="1500" rows="5" placeholder="What would you like to promote? / Co chcesz promować?"></textarea>
          <button id="sponsorSend" class="primary-btn" type="submit">SEND INQUIRY / WYŚLIJ ZAPYTANIE</button>
          <p id="sponsorStatus" class="status-text"></p>
        </form>
      </section>
      <p class="fineprint"><a href="./">← PROJECT 99</a> · <a href="./privacy.html">Privacy</a> · <a href="./terms.html">Terms</a></p>
    </section>
  </main>
  <script type="module" src="./sponsor.js?v=1"></script>
</body>
</html>
