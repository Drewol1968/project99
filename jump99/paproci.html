}
function draw(now){
 bg();dragon(now);ground();
 for(const g of world.amber)gem(g,now);
 for(const bonus of world.bonuses)if(!bonus.taken){
  const x=bonus.x-dist;
  if(x>-30&&x<W+30){
   ball(x,463+Math.sin(now*.004)*5,23,"#b5ffb92d");
   ball(x,463+Math.sin(now*.004)*5,16,bonus.kind==="shield"?"#65d2ba":bonus.kind==="bolt"?"#e5b657":"#ef9aaa");
   text(bonus.kind==="shield"?"✦":bonus.kind==="bolt"?"⚡":"♥",x,471+Math.sin(now*.004)*5,23,"#fff","center");
  }
 }
 for(const o of world.traps)enemy(o,now);
 for(const f of fire){ball(f.x-dist,f.y,17,"#ff8f5259");ball(f.x-dist,f.y,10,"#fb623e");ball(f.x-dist-3,f.y-3,4,"#ffda69")}
 hero(now);effects();electric(now);hud();
}
function panel(kind){
 mode=kind;let title="",desc="",icon="🌿",buttons="",extra="";
 if(kind==="menu"){
  title="JUMP 99<br><span>KWIAT PAPROCI</span>";desc=T.intro;
  extra='<div class="worlds">'+T.worlds.map(s=>'<div>'+s+'</div>').join("")+'</div>';
  buttons='<button class="btn" data-go="start">'+T.start+'</button>';
 }else if(kind==="pause"){
  title=T.pause;icon="⏸";desc=T.intro;
  buttons='<button class="btn" data-go="resume">'+T.resume+'</button>';
 }else if(kind==="clear"){
  title=T.clear;icon=["🌲","🌫️","🐉"][level];
  desc=T.worlds[level+1]||"";extra='<div class="result">'+score+' '+T.points+'</div>';
  buttons='<button class="btn" data-go="next">'+T.next+'</button>';
 }else if(kind==="lose"){
  title=T.lose;icon="💔";desc=T.worlds[level];
  extra='<div class="result">'+score+' '+T.points+'</div>';
  buttons='<button class="btn" data-go="start">'+T.again+'</button>';
 }else if(kind==="win"){
  title=T.win;icon="🌿";desc=record?T.newBest:T.intro;
  extra='<div class="result">'+score+' '+T.points+'</div><p>'+T.best+': '+best+'</p>';
  buttons='<button class="btn" data-go="share">'+T.share+'</button><button class="btn alt" data-go="start">'+T.again+'</button>';
 }
 overlay.innerHTML='<div class="panel"><div class="eyebrow">PROJECT 99 · SLAVIC ADVENTURE</div><div class="emblem">'+icon+'</div><h1>'+title+'</h1><p>'+desc+'</p>'+extra+buttons+'</div>';
 overlay.hidden=false;
}
function begin(){
 level=0;dist=0;world=makeWorld(0);y=GROUND-PH;vy=0;onFloor=true;hearts=3;score=0;gems=0;shield=0;immune=0;boltCD=0;particles=[];fire=[];mode="playing";overlay.hidden=true;jumpCount=0;combo=0;lastAmberTime=-99;boltPaths=[];boltFlash=0;notice="";fireMarks=new Set();ping(590,.13);
}
function next(){
 level++;dist=0;world=makeWorld(level);y=GROUND-PH;vy=0;onFloor=true;immune=1;fire=[];boltCD=0;mode="playing";overlay.hidden=true;jumpCount=0;combo=0;lastAmberTime=-99;boltPaths=[];boltFlash=0;notice="";fireMarks=new Set();ping(690,.18);
}
function hurt(pit=false){
 if(immune>0&&!pit)return;
 ping(170,.22,"sawtooth");vibrate();
 if(shield){shield=0;immune=1.3;if(!pit)return;}
 else{hearts--;immune=1.5;}
 if(hearts<=0){panel("lose");return}
 if(pit){
  const wx=dist+PX+PW/2;
  const g=world.gaps.find(a=>wx>a[0]-80&&wx<a[1]+350);
  dist=Math.max(0,(g?g[0]-250:wx-350)-PX);
  y=GROUND-PH;vy=0;onFloor=true;jumpCount=0;fire=[];
 }
}
function jump(){
 if(mode!=="playing")return;
 if(onFloor || jumpCount<2){
  const second=!onFloor;
  vy=second?JUMP*.87:JUMP;onFloor=false;jumpCount=second?2:1;
  burst(PX+15,y+PH,second?"#baf9ff":"#e1ffc4",second?13:6);
  if(second)announce(pl?"✨ PODWÓJNY SKOK!":"✨ DOUBLE JUMP!",.75);
  ping(second?690:440,.085,"triangle",.05);
 }
}
function thunder(){
 if(mode!=="playing"||boltCD>0)return;
 // Eligible visible targets and those about to enter the screen.
 const targetList=[];
 for(const o of world.traps){
  const sx=o.x-dist;
  if(!o.dead&&sx>PX+20&&sx<W+74)targetList.push({kind:"trap",obj:o,x:Math.min(W-18,sx+20),y:o.kind==="bat"?GROUND-98:GROUND-40});
 }
 for(const f of fire){
  const sx=f.x-dist;
  if(!f.dead&&sx>PX+20&&sx<W+60)targetList.push({kind:"fire",obj:f,x:Math.min(W-18,sx),y:f.y});
 }
 boltPaths=targetList.length?targetList.map(t=>({x:t.x,y:t.y})):[{x:240,y:365}];
 boltFlash=.5;
 burst(240,322,"#efffff",18);
 ping(230,.28,"sawtooth",.085);vibrate();
 if(targetList.length===0){
  announce(pl?"⚡ BRAK CELU — PIORUN NADAL GOTOWY":"⚡ NO TARGET — THUNDER READY",1.8);
  return; // no cooldown when nothing can be hit
 }
 boltCD=5.0;
 for(const target of targetList){
  target.obj.dead=true;
  if(target.kind==="trap")score+=35;
  else score+=15;
  burst(target.x,target.y,"#d9f9ff",28);
 }
 fire=fire.filter(f=>!f.dead);
 announce((pl?"⚡ ZNISZCZONO: ":"⚡ DESTROYED: ")+targetList.length,1.8);
}
function finishWorld(){
 score+=200+hearts*50;
 if(level<2){panel("clear");return}
 record=score>best;if(record){best=score;try{localStorage.setItem("p99_fern_best",String(best))}catch{}}
 panel("win");
}
function update(dt){
 time+=dt;
 boltFlash=Math.max(0,boltFlash-dt);
 particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});
 particles=particles.filter(p=>p.life>0);
 if(mode!=="playing")return;
 immune=Math.max(0,immune-dt);boltCD=Math.max(0,boltCD-dt);
 if(time-lastAmberTime>2.8)combo=0;
 dist+=([228,241,257][level])*dt;
 const wx=dist+PX+PW/2,gap=world.gaps.find(g=>wx>g[0]&&wx<g[1]);
 if(onFloor){
  if(gap){onFloor=false;vy=40;}
  else{y=GROUND-PH;vy=0;}
 }
 if(!onFloor){
  const oldFoot=y+PH;vy+=GRAV*dt;y+=vy*dt;
  if(vy>=0&&oldFoot<=GROUND+15&&y+PH>=GROUND&&!gap){y=GROUND-PH;vy=0;onFloor=true;jumpCount=0;}
  if(y>H+25){hurt(true);if(mode!=="playing")return}
 }
 const h=box(PX+5,y+4,PW-10,PH-7);
 for(const g of world.amber){
  if(!g.taken&&Math.abs(g.x-dist-PX)<33&&overlaps(h,box(g.x-dist-12,g.y-16,24,32))){
   g.taken=true;gems++;combo++;lastAmberTime=time;const multiplier=Math.min(5,1+Math.floor(combo/5));score+=10*multiplier;burst(g.x-dist,g.y,"#ffdc84",multiplier>1?14:7);if(multiplier>1&&combo%5===0){announce("✨ COMBO x"+multiplier,1.0);ping(790,.08);}
  }
 }
 for(const b of world.bonuses)if(!b.taken&&overlaps(h,box(b.x-dist-18,443,36,43))){
  b.taken=true;if(b.kind==="shield")shield=1;else if(b.kind==="bolt")boltCD=0;else hearts=Math.min(3,hearts+1);
  announce(b.kind==="shield"?"✦ "+T.shield:b.kind==="bolt"?"⚡ "+(pl?"ODNOWIONY PIORUN":"THUNDER REFILLED"):"♥ +1",1.4);
  burst(b.x-dist,465,"#b4ffe6",16);ping(890,.16);
 }
 for(const o of world.traps)if(!o.dead&&overlaps(h,obstacleBounds(o))){
  o.dead=true;hurt();if(mode!=="playing")return;
 }
 if(level===2){
  for(const mark of [3280,3660,4020])if(dist>=mark&&!fireMarks.has(mark)){
   fireMarks.add(mark);
   fire.push({x:dist+450,y:mark===3660?GROUND-92:GROUND-28,dead:false});
   announce(pl?"🐉 SMOK ZIONIE OGNIEM!":"🐉 DRAGON FIRE!",1.5);
   ping(160,.25,"sawtooth");
  }
 }
 for(const f of fire){
  if(f.dead)continue;f.x-=130*dt;
  if(overlaps(h,box(f.x-dist-12,f.y-12,24,24))){f.dead=true;hurt();if(mode!=="playing")return}
  if(f.x-dist<-30)f.dead=true;
 }
 fire=fire.filter(f=>!f.dead);
 if(wx>=world.length)finishWorld();
}
async function share(){
 const url="https://project99.appforge99.com/jump99/paproci.html";
 const words=T.shareText(score)+url;
 try{
  if(navigator.share){await navigator.share({title:"JUMP 99 — Fern Flower",text:words,url});return;}
  if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(words);return;}
 }catch(e){if(e.name==="AbortError")return}
 const ta=document.createElement("textarea");ta.value=words;document.body.appendChild(ta);ta.select();try{document.execCommand("copy")}catch{}ta.remove();
}
overlay.addEventListener("click",e=>{
 const button=e.target.closest("button[data-go]");if(!button)return;
 const a=button.dataset.go;
 if(a==="start")begin();if(a==="next")next();if(a==="resume"){mode="playing";overlay.hidden=true}
 if(a==="share"){share();button.textContent=pl?"✓ SKOPIOWANO / UDOSTĘPNIONO":"✓ SHARED / COPIED";}
});
canvas.addEventListener("pointerdown",e=>{e.preventDefault();jump()});
const j=document.getElementById("jump");
j.addEventListener("pointerdown",e=>{e.preventDefault();jump()});
j.addEventListener("click",e=>{if(e.detail===0)jump()});
boltBtn.addEventListener("pointerdown",e=>{e.preventDefault();thunder()});
boltBtn.addEventListener("click",e=>{if(e.detail===0)thunder()});
pauseBtn.addEventListener("click",()=>{if(mode==="playing")panel("pause");else if(mode==="pause"){mode="playing";overlay.hidden=true}});
window.addEventListener("keydown",e=>{
 if(e.repeat)return;
 if(["Space","ArrowUp","KeyW"].includes(e.code)){e.preventDefault();jump()}
 if(e.code==="KeyE")thunder();
 if(e.code==="KeyP"||e.code==="Escape"){if(mode==="playing")panel("pause");else if(mode==="pause"){mode="playing";overlay.hidden=true}}
});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&mode==="playing")panel("pause")});
const soundBtn=document.getElementById("sound");
soundBtn.addEventListener("click",()=>{soundOn=!soundOn;soundBtn.textContent=soundOn?"🔊":"🔇";if(soundOn)ping(650,.1);});
function frame(now){
 const dt=Math.min(.033,Math.max(0,(now-prev)/1000));prev=now;
 update(dt);draw(now);
 boltBtn.disabled=mode!=="playing"||boltCD>0;
 document.getElementById("boltText").textContent=boltCD>0?Math.ceil(boltCD)+"s":T.bolt;
 pauseBtn.textContent=mode==="pause"?"▶":"⏸";
 requestAnimationFrame(frame);
}
world=makeWorld(0);panel("menu");requestAnimationFrame(frame);
})();
</script>
</body>
</html>
